AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Drift-monitoring plane for the fraud-detection endpoint. Provisions the
  infrastructure that notebook 3 used to create imperatively (SQS results
  queue, monitoring-results writer Lambda, SNS alert topic, CloudWatch
  dashboard + alarms, and the IAM role the scheduled drift-monitor Lambda
  assumes). Deploy this ONCE so the data-scientist notebook
  (3_inference_monitoring_quickstart.ipynb) can focus on drift detection
  instead of plumbing.

  NOT created here (by design): the scheduled drift-monitor Lambda itself is
  a container image that must be built with `docker build`, which CloudFormation
  cannot do. Deploy it with scripts/deploy_lambda_container.sh AFTER this stack
  is live — that script reuses the IAM role and SNS topic created here.

# ===========================================================================
# Parameters
# ===========================================================================
Parameters:
  ProjectName:
    Type: String
    Default: 'fraud-detection'
    Description: 'Prefix for resource names/tags (lowercase letters, numbers, hyphens).'
    AllowedPattern: '^[a-z0-9-]+$'

  DataBucketName:
    Type: String
    Description: >-
      Name of the existing S3 data-lake bucket (the DataBucket output of the
      domain stack). Used for Athena query results and Evidently report storage.

  AthenaDatabase:
    Type: String
    Default: 'fraud_detection'
    Description: 'Glue/Athena database that holds the Iceberg tables.'

  MonitoringTableName:
    Type: String
    Default: 'monitoring_responses'
    Description: 'Athena Iceberg table the writer Lambda INSERTs monitoring runs into.'

  EndpointName:
    Type: String
    Default: 'fraud-detector-endpoint'
    Description: 'SageMaker endpoint being monitored (CloudWatch metric dimension).'

  AlertEmail:
    Type: String
    Default: ''
    Description: >-
      Email address to subscribe to drift alerts. Leave blank to skip the
      subscription (you can add one later in the SNS console). A confirmation
      email is sent on stack create when set.

  DataDriftThreshold:
    Type: Number
    Default: 0.2
    Description: 'PSI value above which the data-drift CloudWatch alarm fires.'

  ModelDriftThreshold:
    Type: Number
    Default: 0.05
    Description: 'Relative degradation (0.05 = 5%) above which model-drift alarms fire.'

  MonitoringQueueName:
    Type: String
    Default: 'fraud-monitoring-results'
    Description: 'SQS queue the drift-monitor Lambda writes results to.'

  MonitoringWriterLambdaName:
    Type: String
    Default: 'fraud-monitoring-results-writer'
    Description: 'Name of the SQS->Athena monitoring-results writer Lambda.'

  SnsTopicName:
    Type: String
    Default: 'fraud-detection-drift-alerts'
    Description: 'SNS topic name for drift alerts.'

  DriftMonitorRoleName:
    Type: String
    Default: 'fraud-detection-drift-monitor-role'
    Description: >-
      IAM role name assumed by the scheduled (container) drift-monitor Lambda.
      scripts/deploy_lambda_container.sh reuses this exact role when it creates
      the function.

  MetricNamespace:
    Type: String
    Default: 'FraudDetection/DriftMonitoring'
    Description: 'CloudWatch namespace for drift metrics.'

  DashboardName:
    Type: String
    Default: 'FraudDetection-DriftMonitoring'
    Description: 'CloudWatch dashboard name.'

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # =========================================================================
  # SNS — drift alert topic (+ optional email subscription)
  # =========================================================================
  DriftAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Ref SnsTopicName
      DisplayName: 'Fraud Detection Drift Alerts'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  DriftAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref DriftAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # =========================================================================
  # SQS — monitoring results queue
  # The drift-monitor Lambda emits one message per run; the writer Lambda
  # below drains it into the monitoring_responses Athena table.
  # =========================================================================
  # Dead-letter queue: poison messages that fail maxReceiveCount deliveries
  # land here instead of blocking the main queue or being retried forever.
  MonitoringResultsDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Sub '${MonitoringQueueName}-dlq'
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MonitoringResultsQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: !Ref MonitoringQueueName
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600  # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MonitoringResultsDLQ.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # =========================================================================
  # Monitoring-results writer Lambda (SQS -> Athena monitoring_responses)
  # Ported verbatim from src/drift_monitoring/deploy_monitoring_writer.py so
  # the notebook no longer needs to build/deploy it at runtime.
  # =========================================================================
  MonitoringWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${MonitoringWriterLambdaName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole'
        - 'arn:aws:iam::aws:policy/AmazonAthenaFullAccess'
      Policies:
        - PolicyName: DataBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucketName}'
                  - !Sub 'arn:aws:s3:::${DataBucketName}/*'

  MonitoringWriterFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FunctionName: !Ref MonitoringWriterLambdaName
      Runtime: python3.11
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt MonitoringWriterRole.Arn
      Description: 'Drains the monitoring-results SQS queue into the monitoring_responses Athena table.'
      Environment:
        Variables:
          ATHENA_DATABASE: !Ref AthenaDatabase
          ATHENA_TABLE: !Ref MonitoringTableName
          ATHENA_OUTPUT: !Sub 's3://${DataBucketName}/athena-query-results/'
      Code:
        ZipFile: |
          import json
          import boto3
          import time
          import os

          athena = boto3.client('athena')

          ATHENA_DATABASE = os.environ['ATHENA_DATABASE']
          ATHENA_TABLE = os.environ['ATHENA_TABLE']
          ATHENA_OUTPUT = os.environ['ATHENA_OUTPUT']

          def lambda_handler(event, context):
              """Process SQS messages and write monitoring results to Athena.

              Returns partial batch failures (ReportBatchItemFailures): only the
              message IDs that failed are reported, so good records are deleted
              and not reprocessed while a poison record is retried on its own and
              eventually moved to the DLQ after maxReceiveCount attempts.
              """
              records = event.get('Records', [])
              print(f"Processing {len(records)} messages")
              # Leave a safety margin before the Lambda timeout: return the
              # UNATTEMPTED records as batchItemFailures if we're about to run
              # out of time, so SQS redelivers them to a fresh invocation
              # instead of the runtime killing us mid-write (which strands the
              # whole in-flight batch and blocks the queue).
              SAFETY_MS = 5000
              batch_item_failures = []
              for idx, record in enumerate(records):
                  message_id = record.get('messageId')
                  remaining = context.get_remaining_time_in_millis() if context else None
                  if remaining is not None and remaining < SAFETY_MS:
                      deferred = records[idx:]
                      print(f"Approaching timeout ({remaining} ms left); deferring "
                            f"{len(deferred)} unattempted record(s) for retry")
                      for r in deferred:
                          batch_item_failures.append({'itemIdentifier': r.get('messageId')})
                      break
                  try:
                      body = json.loads(record['body'])
                      write_to_athena(body, context)
                  except Exception as e:
                      print(f"Error processing message {message_id}: {e}")
                      batch_item_failures.append({'itemIdentifier': message_id})
              return {'batchItemFailures': batch_item_failures}

          def write_to_athena(data, context=None):
              """Write one monitoring result row to the Iceberg table (idempotently).

              Persistence is an Iceberg MERGE INTO keyed on monitoring_run_id:
              the row is inserted only WHEN NOT MATCHED, so SQS at-least-once
              redelivery of the same run is a no-op rather than a duplicate row.
              (Athena engine v3 supports MERGE INTO for Apache Iceberg tables.)
              The named column list is a plain projection, so column ORDER is
              flexible. The authoritative monitoring_responses column set lives
              in create_athena_tables.py (the DDL) and deploy_monitoring_writer.py
              (the sibling writer); keep this copy in sync with those two.
              """
              columns = [
                  'monitoring_run_id', 'monitoring_timestamp',
                  'endpoint_name', 'model_version', 'model_package_arn',
                  'evaluation_snapshot_id', 'training_snapshot_id',
                  'data_drift_detected', 'drifted_columns_count', 'drifted_columns_share',
                  'features_analyzed', 'data_sample_size', 'model_drift_detected',
                  'baseline_roc_auc', 'current_roc_auc',
                  'roc_auc_degradation', 'roc_auc_degradation_pct',
                  'accuracy', 'precision', 'recall', 'f1_score',
                  'model_sample_size', 'per_feature_drift_scores',
                  'evidently_report_s3_path', 'mlflow_run_id',
                  'alert_sent', 'detection_engine', 'created_at',
                  'problem_type', 'primary_metric', 'baseline_primary',
                  'current_primary', 'mae', 'rmse', 'r2', 'execution_status',
                  'data_drift_status', 'model_drift_status',
              ]
              timestamp_cols = {'monitoring_timestamp', 'created_at'}

              values = []
              for col in columns:
                  val = data.get(col)
                  if val is None:
                      values.append('NULL')
                  elif isinstance(val, bool):
                      values.append('TRUE' if val else 'FALSE')
                  elif isinstance(val, (int, float)):
                      values.append(str(val))
                  elif col in timestamp_cols:
                      val_str = str(val).replace("'", "''")
                      values.append(f"TIMESTAMP '{val_str}'")
                  else:
                      val_str = str(val).replace("'", "''")
                      values.append(f"'{val_str}'")

              col_list = ', '.join(columns)
              # Idempotent + MONOTONIC write: MERGE a single-row source (each
              # value aliased to its column) into the target on monitoring_run_id.
              # Insert when new; when a row exists, UPDATE it ONLY to reconcile a
              # prior best-effort ERROR row up to a real verdict (ERROR ->
              # non-ERROR). A late/duplicate ERROR delivery can NOT regress an
              # already-recorded SUCCESS back to ERROR.
              select_cols = ', '.join(f"{v} AS {c}" for v, c in zip(values, columns))
              insert_vals = ', '.join(f"s.{c}" for c in columns)
              update_set = ', '.join(f"{c} = s.{c}" for c in columns if c != 'monitoring_run_id')
              query = (
                  f"MERGE INTO {ATHENA_DATABASE}.{ATHENA_TABLE} AS t "
                  f"USING (SELECT {select_cols}) AS s "
                  f"ON t.monitoring_run_id = s.monitoring_run_id "
                  f"WHEN MATCHED AND t.execution_status = 'ERROR' AND s.execution_status <> 'ERROR' "
                  f"THEN UPDATE SET {update_set} "
                  f"WHEN NOT MATCHED THEN INSERT ({col_list}) VALUES ({insert_vals})"
              )

              response = athena.start_query_execution(
                  QueryString=query,
                  QueryExecutionContext={'Database': ATHENA_DATABASE},
                  ResultConfiguration={'OutputLocation': ATHENA_OUTPUT},
              )
              execution_id = response['QueryExecutionId']
              print(f"Athena query started: {execution_id}")

              # Bound the poll by the invocation's remaining time so a slow
              # query can't run us into the hard Lambda timeout (killing the
              # process mid-poll). If we're about to run out, raise so the caller
              # returns this record as a batchItemFailure for a clean SQS retry.
              SAFETY_MS = 3000
              while True:
                  status = athena.get_query_execution(QueryExecutionId=execution_id)
                  state = status['QueryExecution']['Status']['State']
                  if state in ['SUCCEEDED', 'FAILED', 'CANCELLED']:
                      break
                  if context is not None and context.get_remaining_time_in_millis() < SAFETY_MS:
                      raise Exception(
                          f"Athena query {execution_id} still {state} with "
                          f"< {SAFETY_MS} ms remaining; deferring for SQS retry"
                      )
                  time.sleep(0.5)

              if state == 'SUCCEEDED':
                  print(f"Written to {ATHENA_DATABASE}.{ATHENA_TABLE}")
              else:
                  reason = status['QueryExecution']['Status'].get('StateChangeReason', 'Unknown')
                  raise Exception(f"Athena query failed: {reason}")
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  MonitoringWriterEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt MonitoringResultsQueue.Arn
      FunctionName: !Ref MonitoringWriterFunction
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      # Honor the handler's batchItemFailures response so a poison record is
      # retried on its own (then DLQ'd) instead of failing the whole batch.
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # =========================================================================
  # IAM role for the SCHEDULED (container) drift-monitor Lambda.
  # The function is created out-of-band by scripts/deploy_lambda_container.sh
  # (container image), but its role is deterministic, so we own it here.
  # Permissions mirror deploy_lambda_container.sh + notebook cell 29.
  # =========================================================================
  DriftMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DriftMonitorRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/AmazonAthenaFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess'
      Policies:
        - PolicyName: DriftMonitorRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Producer to the monitoring-results queue.
              - Effect: Allow
                Action:
                  - 'sqs:SendMessage'
                  - 'sqs:GetQueueAttributes'
                  - 'sqs:GetQueueUrl'
                Resource: !GetAtt MonitoringResultsQueue.Arn
              # Publish drift alerts.
              - Effect: Allow
                Action: 'sns:Publish'
                Resource: !Ref DriftAlertsTopic
              # Emit CloudWatch drift metrics every run (incl. the heartbeat).
              # PutMetricData has no resource-level ARN, so Resource '*' scoped
              # by the namespace condition is the correct least-privilege idiom.
              - Effect: Allow
                Action: 'cloudwatch:PutMetricData'
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': !Ref MetricNamespace
              # Write Athena query results + Evidently HTML reports.
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucketName}'
                  - !Sub 'arn:aws:s3:::${DataBucketName}/*'
              # Resolve baseline.json from the model package serving the endpoint.
              - Effect: Allow
                Action:
                  - 'sagemaker:ListModelPackages'
                  - 'sagemaker:DescribeModelPackage'
                  - 'sagemaker:DescribeEndpoint'
                  - 'sagemaker:DescribeEndpointConfig'
                  - 'sagemaker:DescribeModel'
                Resource: '*'

  # =========================================================================
  # CloudWatch alarms — fire on the metrics the drift-monitor Lambda publishes.
  # AlarmActions notify the SNS topic (the imperative script left this unwired).
  # =========================================================================
  # Deliberate early-warning tier: fires on the share of drifted columns
  # BEFORE the run's overall data-drift verdict (DataDriftDetected) trips —
  # a leading indicator that individual features are shifting.
  DataDriftPsiAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: 'FraudDetection-DataDrift-PSI'
      AlarmDescription: !Sub 'Data drift early-warning: share of drifted columns exceeds ${DataDriftThreshold}.'
      Namespace: !Ref MetricNamespace
      MetricName: 'DriftedColumnsShare'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref DataDriftThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Endpoint
          Value: !Ref EndpointName
      AlarmActions:
        - !Ref DriftAlertsTopic

  ModelDriftRocAucAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: 'FraudDetection-ModelDrift-ROCAUCDEGRADATION'
      AlarmDescription: !Sub 'Model drift: relative degradation of the primary metric (ROC-AUC / accuracy / RMSE) from baseline exceeds ${ModelDriftThreshold}.'
      Namespace: !Ref MetricNamespace
      MetricName: 'PrimaryMetricDegradationRatio'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref ModelDriftThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: Endpoint
          Value: !Ref EndpointName
      AlarmActions:
        - !Ref DriftAlertsTopic

  # Repurposed (was ModelDriftAccuracyAlarm): the old alarm fired
  # GreaterThanThreshold on the RAW Accuracy metric vs ModelDriftThreshold
  # (~0.1), i.e. whenever accuracy > 0.1 — effectively ALWAYS. Replaced with a
  # heartbeat / no-data alarm: DriftRunExecuted is emitted on every scheduled
  # run, so its absence over ~25h means the schedule stalled. Not referenced in
  # Outputs, so the logical ID was renamed for clarity (the dashboard alarm
  # strip references it by AlarmName, updated below).
  DriftMonitorHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: 'FraudDetection-DriftMonitor-NoHeartbeat'
      AlarmDescription: 'The scheduled drift monitor has not run (no DriftRunExecuted heartbeat) in the expected window.'
      Namespace: !Ref MetricNamespace
      MetricName: 'DriftRunExecuted'
      Statistic: Sum
      # Rolling ~25h window (one daily run + slack) built from 25 consecutive
      # 1h periods. A single 90000s period snapped to fixed CloudWatch period
      # boundaries could take ~50h to detect a missed daily run; requiring 25
      # consecutive breaching/missing 1h datapoints gives a rolling window that
      # detects the miss within ~1h of the 25h mark.
      Period: 3600
      EvaluationPeriods: 25
      DatapointsToAlarm: 25
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      Dimensions:
        - Name: Endpoint
          Value: !Ref EndpointName
      AlarmActions:
        - !Ref DriftAlertsTopic

  # Surfaces monitoring rows that failed to persist. After maxReceiveCount
  # redeliveries the writer's poison/timed-out records land in the DLQ; without
  # this alarm they sit there silently and the monitoring history is quietly
  # incomplete. Any visible DLQ message pages the same SNS topic. TreatMissingData
  # is notBreaching so an empty DLQ (the normal state, no metric emitted) stays OK.
  MonitoringWriterDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: 'FraudDetection-MonitoringWriter-DLQ'
      AlarmDescription: 'Monitoring-writer records landed in the DLQ — some monitoring rows failed to persist after retries.'
      Namespace: 'AWS/SQS'
      MetricName: 'ApproximateNumberOfMessagesVisible'
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt MonitoringResultsDLQ.QueueName
      AlarmActions:
        - !Ref DriftAlertsTopic

  # NOTE: The former ModelDriftPrecisionAlarm / ModelDriftRecallAlarm resources
  # were REMOVED. They alarmed GreaterThanThreshold on the RAW Precision / Recall
  # metrics (~0.8) vs ModelDriftThreshold (~0.05), so they fired on essentially
  # every publish — a false positive by construction (Precision/Recall are raw
  # quality metrics, not degradation ratios, and have no meaningful fixed
  # GreaterThan threshold). The model-drift condition is already covered by
  # ModelDriftRocAucAlarm (PrimaryMetricDegradationRatio) and the Lambda's
  # ModelDriftDetected metric. Precision/Recall now appear only as raw-value
  # time series on the "Model Quality - Current Metrics" dashboard widget.

  # =========================================================================
  # CloudWatch dashboard — data-drift PSI + model-drift degradation trends
  # plus a live alarm-status strip. Mirrors create_cloudwatch_monitoring.py.
  # =========================================================================
  DriftDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# Fraud Detection - Drift Monitoring Dashboard\n**Endpoint:** `${EndpointName}` | **Data-drift PSI alarm:** ${DataDriftThreshold} | **Model-drift alarm:** ${ModelDriftThreshold}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["${MetricNamespace}", "DriftedColumnsShare", "Endpoint", "${EndpointName}", {"stat": "Average"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Data Drift - Share of Drifted Columns",
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 1}},
                "annotations": {
                  "horizontal": [
                    {"label": "Alarm Threshold", "value": ${DataDriftThreshold}, "fill": "above", "color": "#d62728"}
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["${MetricNamespace}", "PrimaryMetricDegradationRatio", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "Primary Metric Degradation (relative)"}],
                  ["${MetricNamespace}", "ROCAUCDegradation", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "ROC-AUC Degradation (absolute, binary)"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Model Drift - Degradation from Baseline",
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 0.5}},
                "annotations": {
                  "horizontal": [
                    {"label": "Alarm Threshold", "value": ${ModelDriftThreshold}, "color": "#d62728"}
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "metrics": [
                  ["${MetricNamespace}", "Accuracy", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "Accuracy"}],
                  ["${MetricNamespace}", "Precision", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "Precision"}],
                  ["${MetricNamespace}", "Recall", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "Recall"}],
                  ["${MetricNamespace}", "CurrentROCAUC", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "Current ROC-AUC"}],
                  ["${MetricNamespace}", "BaselineROCAUC", "Endpoint", "${EndpointName}", {"stat": "Average", "label": "Baseline ROC-AUC"}]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "${AWS::Region}",
                "title": "Model Quality - Current Metrics",
                "period": 300,
                "yAxis": {"left": {"min": 0, "max": 1}}
              }
            },
            {
              "type": "alarm",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Drift Alarms Status",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:FraudDetection-DataDrift-PSI",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:FraudDetection-ModelDrift-ROCAUCDEGRADATION",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:FraudDetection-DriftMonitor-NoHeartbeat"
                ]
              }
            }
          ]
        }

# ===========================================================================
# Outputs — consumed by the notebook (read-only confirmation) and by
# scripts/deploy_lambda_container.sh.
# ===========================================================================
Outputs:
  DriftAlertsTopicArn:
    Description: 'SNS topic ARN for drift alerts.'
    Value: !Ref DriftAlertsTopic
    Export:
      Name: !Sub '${AWS::StackName}-DriftAlertsTopicArn'

  MonitoringResultsQueueUrl:
    Description: 'SQS queue URL the drift-monitor Lambda writes results to.'
    Value: !Ref MonitoringResultsQueue
    Export:
      Name: !Sub '${AWS::StackName}-MonitoringQueueUrl'

  MonitoringResultsQueueArn:
    Description: 'SQS queue ARN.'
    Value: !GetAtt MonitoringResultsQueue.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MonitoringQueueArn'

  MonitoringWriterFunctionArn:
    Description: 'Monitoring-results writer Lambda ARN.'
    Value: !GetAtt MonitoringWriterFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MonitoringWriterArn'

  DriftMonitorRoleArn:
    Description: 'IAM role ARN for the scheduled (container) drift-monitor Lambda.'
    Value: !GetAtt DriftMonitorRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DriftMonitorRoleArn'

  DashboardName:
    Description: 'CloudWatch dashboard name.'
    Value: !Ref DashboardName

  DashboardURL:
    Description: 'CloudWatch dashboard console URL.'
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${DashboardName}'
